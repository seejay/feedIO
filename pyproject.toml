[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feedio"
dynamic = ["version"]
description = "A desktop feed reader that learns your interests"
readme = "README.txt"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Chanaka Jayamal"}]
dependencies = [
  "PyQt6>=6.6,<7", "PyQt6-WebEngine>=6.6,<7", "SQLAlchemy>=2.0,<3",
  "platformdirs>=4,<5", "feedparser>=6,<7", "beautifulsoup4>=4.12,<5",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
speech = ["pyttsx3>=2.99,<3"]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1", "pytest-qt>=4", "pyinstaller>=6"]

[project.gui-scripts]
feedio = "feedio.feedIO:main"

[tool.setuptools.dynamic]
version = {attr = "feedio.__version__"}

[tool.setuptools.packages.find]
include = ["feedio*"]

[tool.setuptools.package-data]
"feedio.UI" = ["*.ui", "*.qrc", "*.ts", "*.qm", "images/*.png"]

[tool.ruff]
target-version = "py310"
exclude = ["feedio/UI/*_ui.py", "feedio/UI/*_rc.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
